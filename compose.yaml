name: helpdesk-flow-local

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helpdesk_flow
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${HELPDESK_DB_PASSWORD:?Execute o script de inicialização para gerar as credenciais locais}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk_flow"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
